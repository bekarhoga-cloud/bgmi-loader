name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto Create Android Structure and Manifest
      run: |
        mkdir -p app/src/main/cpp
        mkdir -p app/src/main/java
        
        # Move source files
        if [ -f main.cpp ]; then cp main.cpp app/src/main/cpp/; fi
        if [ -f build.gradle ] && [ ! -f app/build.gradle ]; then cp build.gradle app/; fi
        
        # Create a default clean AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com"
            package="com.bgmi.loader">
            <application
                android:allowBackup="true"
                android:label="BGMI Loader"
                android:supportsRtl="true">
            </application>
        </manifest>
        EOF

    - name: Auto Fix Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew

    - name: Build Android APK
      run: ./gradlew build -x test --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: BGMI-Loader-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/**/*.apk
          **/*.apk
