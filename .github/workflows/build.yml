name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto Create Android Directories
      run: |
        mkdir -p app/src/main/cpp
        mkdir -p app/src/main/java
        if [ -f main.cpp ]; then cp main.cpp app/src/main/cpp/; fi
        if [ -f build.gradle ] && [ ! -f app/build.gradle ]; then cp build.gradle app/; fi

    - name: Auto Fix Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew

    - name: Build Android APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: BGMI-Loader-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk


